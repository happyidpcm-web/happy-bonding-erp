# Nginx Reverse Proxy Configuration for erp.happybonding.in

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name erp.happybonding.in;

    # Certbot challenge location for SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.happybonding.in;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/erp.happybonding.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.happybonding.in/privkey.pem;

    # SSL Recommended Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload size for contact import & bill images
    client_max_body_size 25M;

    # Proxy all traffic to Happy Bonding ERP Node/Express container
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Header forwarding for real client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
