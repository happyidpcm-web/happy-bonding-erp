services:
  postgres:
    image: postgres:16-alpine
    container_name: happybonding_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-happybonding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happybonding_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-happybonding_erp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - happybonding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-happybonding} -d ${POSTGRES_DB:-happybonding_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: happybonding_app
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-happybonding}:${POSTGRES_PASSWORD:-happybonding_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-happybonding_erp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-happybonding_super_secret_jwt_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - happybonding_backups:/app/backups

volumes:
  happybonding_pgdata:
  happybonding_backups:
