name: Deploy ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: happy-bonding-erp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the deployment server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload source and restart ERP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --exclude='.git/' --exclude='.env' --exclude='.env.*' --exclude='node_modules/' --exclude='dist/' --exclude='backups/' ./ "root@$DEPLOY_HOST:/var/www/happybonding/erp/"
          ssh "root@$DEPLOY_HOST" 'set -e; cd /var/www/happybonding/erp; npm ci; npm run build; pm2 restart happybonding-erp; pm2 save; curl --fail --silent http://127.0.0.1:4000/api/health'
